name: TestFlight

# Сборка на Mac-сервере GitHub и отправка в TestFlight — без Expo.
# Подпись автоматическая через ключ App Store Connect API (секреты репозитория):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (содержимое .p8 файла).
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Свежий Xcode (Expo 57 требует Xcode 26.4+)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Xcode: $X"
          sudo xcode-select -s "$X"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Номер сборки
        # Номер должен расти и быть больше прежних сборок (в том числе из EAS),
        # иначе TestFlight не считает сборку новой.
        run: node -e "const f=require('fs');const j=JSON.parse(f.readFileSync('app.json'));j.expo.ios.buildNumber=String(100+Number(process.env.RUN));f.writeFileSync('app.json',JSON.stringify(j,null,2))"
        env:
          RUN: ${{ github.run_number }}
      - name: Нативный проект
        run: npx expo prebuild -p ios --no-install --clean && cd ios && pod install
      - name: Ключ App Store Connect
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Сборка архива
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS scheme=$SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/app.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=RH67B2MANC CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=$((100 + ${{ github.run_number }}))
      - name: Отправка в TestFlight
        run: |
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>app-store-connect</string>' \
            '<key>destination</key><string>upload</string>' \
            '<key>teamID</key><string>RH67B2MANC</string>' \
            '<key>signingStyle</key><string>automatic</string>' \
            '</dict></plist>' > build/export.plist
          xcodebuild -exportArchive -archivePath build/app.xcarchive -exportOptionsPlist build/export.plist \
            -exportPath build/out -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
